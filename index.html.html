  <!-- =====================================================
       RASTREIO AVANÇADO (2/2) - LEVA fbp / fbc / external_id
       ATÉ O CHECKOUT
       - Lê os cookies _fbp e _fbc do pixel. Se o _fbc ainda não
         existir, monta a partir do fbclid do anúncio (formato da Meta).
       - Coloca fbp, fbc e external_id na URL da página. Assim o botão
         da VTurb (que copia a URL) já leva tudo.
       - Garante também no clique: qualquer link para a KashPay sai
         com esses parâmetros.
  ====================================================== -->
  <script>
    (function(){
      var CHECKOUT_HOST='checkout.kashpay.com';
      var t0=Date.now();
      function cookie(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]+)'));return m?decodeURIComponent(m[1]):'';}
      function fbclid(){try{return new URLSearchParams(location.search).get('fbclid')||'';}catch(e){return '';}}
      function ids(){
        var fbc=cookie('_fbc'),f=fbclid();
        if(!fbc&&f){fbc='fb.1.'+t0+'.'+f;}
        return {fbp:cookie('_fbp'),fbc:fbc,external_id:window.__dspVid||''};
      }
      function addTo(u){
        var v=ids();
        Object.keys(v).forEach(function(k){if(v[k]&&!u.searchParams.has(k))u.searchParams.set(k,v[k]);});
        return u;
      }
      function syncPageUrl(){
        try{
          var u=addTo(new URL(location.href));
          if(u.toString()!==location.href)history.replaceState(history.state,'',u.toString());
        }catch(e){}
      }
      // o pixel grava o _fbp alguns instantes depois de carregar: tenta por até 8s
      syncPageUrl();
      var tries=0,iv=setInterval(function(){tries++;syncPageUrl();if(cookie('_fbp')||tries>16)clearInterval(iv);},500);

      // no clique: reescreve qualquer link da KashPay (inclusive dentro do player)
      document.addEventListener('click',function(e){
        var path=e.composedPath?e.composedPath():[e.target];
        for(var i=0;i<path.length;i++){
          var a=path[i];
          if(a&&a.tagName==='A'&&a.href&&a.href.indexOf(CHECKOUT_HOST)>-1){
            try{a.href=addTo(new URL(a.href)).toString();}catch(err){}
            break;
          }
        }
      },true);

      window.__dspCheckoutParams=ids;
    })();
  </script>
